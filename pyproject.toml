[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrna-copilot"
version = "0.1.0"
description = "Reproducible scRNA-seq pipeline with an MCP server for agentic analysis"
requires-python = ">=3.10"
dependencies = [
  "scanpy>=1.10",
  "leidenalg>=0.10",
  "igraph>=0.11",
  "mcp[cli]>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
scrna-copilot-mcp = "scrna_copilot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
